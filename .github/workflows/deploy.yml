name: Deploy na websolutions.sk/samborska

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola nastavenia
        env:
          FTP_DIR: ${{ vars.FTP_DIR }}
          HAS_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASS: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          ok=1
          [ "$HAS_SERVER" = true ] || { echo "::error::Chýba secret FTP_SERVER"; ok=0; }
          [ "$HAS_USER" = true ]   || { echo "::error::Chýba secret FTP_USERNAME"; ok=0; }
          [ "$HAS_PASS" = true ]   || { echo "::error::Chýba secret FTP_PASSWORD"; ok=0; }
          case "$FTP_DIR" in
            "") echo "::error::Chýba Repository variable FTP_DIR (napr. /web/samborska/)"; ok=0 ;;
            samborska/|*/samborska/) echo "Cieľ: $FTP_DIR" ;;
            *) echo "::error::FTP_DIR musí byť samborska/ alebo končiť na /samborska/ (je: $FTP_DIR)"; ok=0 ;;
          esac
          [ $ok = 1 ]

      - name: Nahrať cez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          # Cesta na serveri, končí lomkou. Nastav ako Repository variable FTP_DIR,
          # napr. "/web/samborska/" (Websupport) alebo "/public_html/samborska/".
          server-dir: ${{ vars.FTP_DIR }}

      - name: Kontrola
        run: |
          curl -fsSL -o page.html -w "HTTP %{http_code} -> %{url_effective}\n" https://websolutions.sk/samborska/
          grep -q "Vila Šamborská" page.html && echo "OK: stránka sa načítala" || { echo "::error::Na adrese nie je stránka Vila Šamborská"; exit 1; }
          curl -fsSL -o /dev/null -w "foto/01.webp: HTTP %{http_code}\n" https://websolutions.sk/samborska/foto/01.webp
