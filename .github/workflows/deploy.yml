name: Deploy na websolutions.sk/samborska

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola nastavenia
        env:
          HAS_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASS: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          ok=1
          [ "$HAS_SERVER" = true ] || { echo "::error::Chýba secret FTP_SERVER"; ok=0; }
          [ "$HAS_USER" = true ]   || { echo "::error::Chýba secret FTP_USERNAME"; ok=0; }
          [ "$HAS_PASS" = true ]   || { echo "::error::Chýba secret FTP_PASSWORD"; ok=0; }
          [ $ok = 1 ]

      - name: Nahrať cez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          # Koreň webu websolutions.sk na FTP je www_root_websolutions_sk/
          server-dir: www_root_websolutions_sk/samborska/

      - name: Kontrola
        run: |
          curl -fsSL -o page.html -w "HTTP %{http_code} -> %{url_effective}\n" https://websolutions.sk/samborska/
          grep -q "Vila Šamborská" page.html && echo "OK: stránka sa načítala" || { echo "::error::Na adrese nie je stránka Vila Šamborská"; exit 1; }
          curl -fsSL -o /dev/null -w "foto/01.webp: HTTP %{http_code}\n" https://websolutions.sk/samborska/foto/01.webp
