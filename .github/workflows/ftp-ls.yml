name: FTP – výpis priečinkov (diagnostika)

on:
  workflow_dispatch:

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: Výpis koreňa FTP (priečinky a index súbory do 3 úrovní)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-force yes; pwd; cls -1 -F; echo ---; find -d 3 . | grep -E '/\$|index\.(html|php)\$'; bye" 2>&1 | grep -v -E 'samborska/(foto|nahlad)/' | head -200
